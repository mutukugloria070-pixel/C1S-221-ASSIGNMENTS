<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Registration Form</title>
</head>
<body>

  <h2>Patient Registration Form</h2>

  <form action="" method="post" name="patient">

    <p>
      Patient Name:<br>
      <input type="text" name="name" size="40">
    </p>

    <p>
      Patient ID:<br>
      <input type="text" name="patient_id" size="40">
    </p>

    <p>
      ID Number:<br>
      <input type="text" name="id_number" size="40">
    </p>

    <p>
      Date of Birth:<br>
      <input type="date" name="dob">
    </p>

    <p>
      Age:<br>
      <input type="number" name="age" min="0" max="120">
    </p>

    <p>
      Gender:<br>
      <input type="radio" name="gender" value="male"> Male
      <input type="radio" name="gender" value="female"> Female
      <input type="radio" name="gender" value="other"> Other
    </p>

    <p>
      Phone Number:<br>
      <input type="tel" name="phone" size="40">
    </p>

    <p>
      Address:<br>
      <textarea name="address" cols="40" rows="3"></textarea>
    </p>

    <p>
      Marital Status:<br>
      <select name="marital_status">
        <option value="">-- Select --</option>
        <option value="single">Single</option>
        <option value="married">Married</option>
        <option value="divorced">Divorced</option>
        <option value="widowed">Widowed</option>
      </select>
    </p>

    <p>
      Next of Kin:<br>
      <input type="text" name="next_of_kin" size="40">
    </p>
